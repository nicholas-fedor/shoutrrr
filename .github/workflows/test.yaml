name: Run tests and upload coverage

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - shoutrrr/**
      - pkg/**
      - internal/**
      - testing/**
      - docs/playground/wasm/**
      - shoutrrr.go
      - go.mod
      - go.sum

permissions:
  contents: read # Set default read-only permissions

jobs:
  test:
    name: Run Tests and Upload Coverage Report
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - windows-2025
          - ubuntu-latest
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          cache-dependency-path: "**/go.sum"
          go-version-file: go.mod

      - name: Install Dependencies
        run: go mod download

      - name: Run Tests
        shell: bash
        run: |
          # The race detector runs on the Linux leg only to keep the macOS and Windows legs fast.
          race=""
          if [ "${RUNNER_OS}" = "Linux" ]; then
            race="-race"
          fi

          go list ./... | grep -vE '/testing/e2e(/|$)' |
            xargs go test -v ${race} -coverpkg=./... -coverprofile coverage.out -covermode atomic

      - name: Upload Coverage Report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
