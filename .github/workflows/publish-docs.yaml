name: Publish Documentation

on:
  workflow_call:
    inputs:
      version:
        description: "Version to deploy (e.g., v0.16.0). Leave empty for dev."
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g., v0.16.0). Leave empty for dev."
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - docs/**
      - Makefile
      - build/mkdocs/**
  release:
    types: [published]

permissions:
  contents: read # Set default read-only permissions

# Deployments push to the gh-pages branch, so they run one at a time and are
# never cancelled midway. The fixed group name also covers runs started by the
# release workflow, where github.workflow names the caller.
concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  build:
    name: Generate Documentation Assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Set executable permissions for script
        run: chmod +x ./scripts/generate-service-config-docs.sh

      - name: Generate Service Config Docs
        run: |
          go mod download
          go clean -cache  # Clear build cache
          ./scripts/generate-service-config-docs.sh

      - name: Build WASM module
        run: make wasm

      # The generated files are ignored by git, so the deploy job receives them
      # as an artifact instead of building them with write access.
      - name: Upload Generated Assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-generated
          path: |
            docs/services/*/*/config.md
            docs/playground/assets/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Build & Deploy Documentation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # For pushing the gh-pages branch
      actions: read
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Generated Assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-generated
          path: docs

      # The job holds a write token, so it restores no caches that another
      # workflow run could have written.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      # Every package, including transitive dependencies, is pinned to a version
      # and its published hashes.
      - name: Install mkdocs
        run: |
          pip install --require-hashes -r build/mkdocs/docs-requirements.txt

      - name: Configure Git Identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Determine Mike Version and Aliases
        id: mike
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${EVENT_NAME}" == "release" ]]; then
            echo "version=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "aliases=latest" >> "$GITHUB_OUTPUT"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "aliases=latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      # mike builds the site and commits it to the local gh-pages branch, which it
      # first updates from origin. It runs without a token, so neither mike nor the
      # mkdocs plugins can push.
      - name: Build Documentation
        env:
          ALIASES: ${{ steps.mike.outputs.aliases }}
          VERSION: ${{ steps.mike.outputs.version }}
        run: |
          if [ -n "${ALIASES}" ]; then
            mike deploy \
              --config-file build/mkdocs/mkdocs.yaml \
              --update-aliases "${VERSION}" "${ALIASES}"
          else
            mike deploy \
              --config-file build/mkdocs/mkdocs.yaml \
              "${VERSION}"
          fi

      # The token is passed to this one git command and is never written to
      # .git/config, so no earlier step could read it.
      - name: Push Documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin gh-pages
