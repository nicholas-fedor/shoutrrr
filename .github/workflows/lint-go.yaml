name: Lint Go

on:
  workflow_dispatch: {}
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - internal/**
      - pkg/**
      - shoutrrr/**
      - testing/**
      - go.mod
      - go.sum
      - shoutrrr.go
      - build/golangci-lint/**
      - .github/workflows/lint-go.yaml

permissions:
  contents: read # Set default read-only permissions

# Pull request runs share a group per pull request, so a new push cancels the
# outdated run. Every other run, including calls from the release workflows,
# gets its own group and is never queued or cancelled.
concurrency:
  group: lint-go-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Run Golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: read
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          cache-dependency-path: "**/go.sum"
          go-version-file: go.mod

      # Fails when go.mod or go.sum differ from what go mod tidy would write, such
      # as a dependency update that changed go.mod without go.sum.
      - name: Check Module Files
        run: go mod tidy -diff

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --timeout=5m --config=build/golangci-lint/golangci.yaml --fix=false
          only-new-issues: true
