# Home Assistant server for local E2E testing
#
# https://github.com/home-assistant/core
#
# Usage:
#   ./setup.sh setup-all
#
# API endpoint: http://localhost:8123
#
# Credentials are created by setup.sh through the onboarding API.

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:24e541ddae5818bf8eb27898b9ba00d0c344a655aa5097e9e9bd4b19356be847
    container_name: shoutrrr-homeassistant
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./config:/config
    restart: unless-stopped
