# Home Assistant server for local E2E testing
#
# https://github.com/home-assistant/core
#
# Usage:
#   ./setup.sh setup-all
#
# API endpoint: http://localhost:8123
#
# Credentials are created by setup.sh through the onboarding API.

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
    container_name: shoutrrr-homeassistant
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./config:/config
    restart: unless-stopped
