# Home Assistant server for local E2E testing
#
# https://github.com/home-assistant/core
#
# Usage:
#   ./setup.sh setup-all
#
# API endpoint: http://localhost:8123
#
# Credentials are created by setup.sh through the onboarding API.

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0
    container_name: shoutrrr-homeassistant
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./config:/config
    restart: unless-stopped
