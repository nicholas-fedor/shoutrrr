# Home Assistant server for local E2E testing
#
# https://github.com/home-assistant/core
#
# Usage:
#   ./setup.sh setup-all
#
# API endpoint: http://localhost:8123
#
# Credentials are created by setup.sh through the onboarding API.

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:1b64d38f38d922bf9d59336451fd6453e1d614f934456af4ee3d2a51061be3a4
    container_name: shoutrrr-homeassistant
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./config:/config
    restart: unless-stopped
